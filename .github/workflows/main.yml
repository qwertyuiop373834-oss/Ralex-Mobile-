name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Model yoxdursa endir
        run: |
          mkdir -p app/src/main/assets
          if [ ! -f app/src/main/assets/esrgan.tflite ]; then
            curl -L -o app/src/main/assets/esrgan.tflite "https://tfhub.dev/captain-pool/lite-model/esrgan-tf2/1?lite-format=tflite" || true
          fi
          ls -la app/src/main/assets
      - name: Build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RalexMobile-APK
          path: app/build/outputs/apk/debug/app-debug.apk
